action_items:
  - id: AI-1
    status: open
    severity: high
    raised_by: code review of story 1-1 (2026-08-09)
    title: "Frontend Sign-in button cannot complete Google login (MismatchingStateError)"
    detail: >-
      frontend/src/components/YoutubeHeader.tsx:21 calls
      fetch(`${BACKEND_URL}/api/auth/google/`) with no `credentials: "include"`. On a
      cross-origin request the browser discards the Set-Cookie, so the session in which
      GoogleAuthInitView stashed `oauth_state` and `oauth_code_verifier` is never persisted.
      The callback then compares against an absent state and raises MismatchingStateError
      before reaching the PKCE exchange. The same file gets this right at L57 for
      /api/auth/me/, which is why the session probe works and only the login button is broken.
      Pre-existing since f023cf4 (2025-08-16); NOT caused by the Django 6.0 bump — a library
      bump cannot make a browser discard a Set-Cookie. The backend side is provably correct
      (curl with Origin returns access-control-allow-credentials: true and the session cookie).
      Impact: the button is the only login entry point for real users, so the app is
      effectively unloggable-into through its own UI.
    proposed_fix: >-
      fetch(url, { credentials: "include" }) — the one-line change L57 already demonstrates
      works in this exact cross-origin / SameSite=None / self-signed-cert setup.
    owner_epic: 2
    notes: >-
      Deliberately not fixed in story 1-1: frontend files are Epic 2 per that story's scope
      table, and the change would put an unrelated fix in a dependency-pin PR.
