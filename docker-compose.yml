services:
  backend:
    build:
      context: ./backend
    command: >
      python manage.py runserver_plus 0.0.0.0:8000 --cert-file /app/certs/localhost.crt --key-file /app/certs/localhost.key
    volumes:
      - ./backend:/app
      - ./backend/certs:/app/certs
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: youtube_organizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    command: npx next dev --experimental-https
    volumes:
      - ./frontend:/app
      - ./frontend/certs:/app/certs
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
