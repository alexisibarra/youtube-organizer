services:
  backend:
    build:
      context: ./backend
    command: >
      python manage.py runserver_plus 0.0.0.0:8000 --cert-file /app/certs/localhost.crt --key-file /app/certs/localhost.key
    volumes:
      - ./backend:/app
      - ./backend/certs:/app/certs
      # Read-only view of the whole checkout, for the AD-20 durability guards only.
      # They assert over repo text (docker-compose.yml, Makefile, bin/, Docs/), and
      # with only ./backend mounted they could not see any of it — so `make backend-test`
      # skipped them and reported green for a suite that never ran. :ro because nothing
      # in the container has any business writing to the checkout.
      - .:/repo:ro
    ports:
      - "8000:8000"
    environment:
      # Where the durability guards find the checkout. /app is a mount of ./backend, so
      # the repo root is NOT an ancestor of the test file in here — walking up from
      # __file__ cannot find it, no matter what is mounted. This names it explicitly.
      REPO_ROOT: /repo
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: youtube_organizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    command: npx next dev --experimental-https
    volumes:
      - ./frontend:/app
      - ./frontend/certs:/app/certs
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # Explicitly named (AD-20): the library is the app's sole home after import, so the
  # volume must not be re-derived from the checkout directory's name. This value is the
  # name Compose already generated implicitly (project "youtube-organizer" + "_" +
  # "postgres_data") — pinning it is a no-op for existing data, which is the entire point.
  # DO NOT "tidy" the hyphen into an underscore: that names a DIFFERENT volume, Postgres
  # initdb's into it empty, and every existing library is silently orphaned.
  postgres_data:
    name: youtube-organizer_postgres_data
  frontend_node_modules:
