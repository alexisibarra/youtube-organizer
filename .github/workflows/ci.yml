name: CI

# Gate stack for this repo: plain npm + Next.js in frontend/, pip + Django in backend/.
# There is no monorepo tooling here (ARCHITECTURE-SPINE.md AD-2): no task runner, no
# alternative package manager, no affected graph — and so no fetch-depth: 0. See
# Docs/CI-AND-GITHUB-GATES.md for the intent behind each layer.
#
# Deliberately NOT here yet, each waiting on the story that creates its tooling.
# Add them when their tooling lands — do not stub them as continue-on-error.
#   TODO(story 2-5): frontend test job + 70% coverage gate (Jest/RTL/axios-mock-adapter harness)
#   TODO(story 1-2): backend coverage gate, once the layered package skeleton lands a test runner
#   TODO(story 3-4): OpenAPI schema/type drift gate (needs 3-1 + 3-3 codegen)
#   TODO(AD-17): push-to-ghcr / deploy — deferred whole; deploy.yml is intentionally
#                left non-functional until the production envelope lands as its own work

# No paths filter, deliberately. GitHub does not synthesize a passing result for a
# job that was filtered out, so with these four as required status checks a
# docs-only PR would wait forever on "Expected — waiting for status to be
# reported" and could only merge by admin override. Running four short jobs on
# every PR is cheaper than an unmergeable PR.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never a run on main/develop: the release flow
  # tags a commit on main, and a cancelled run would leave that commit with no
  # passing CI record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth: an exact pin, read by nvm and enforced by
          # .githooks/pre-push, which blocks a push made on a different Node.
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # frontend/package.json has no type-check script, so invoke tsc directly.
      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth: an exact pin, read by nvm and enforced by
          # .githooks/pre-push, which blocks a push made on a different Node.
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

  test:
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: youtube_organizer
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    # settings.py defaults POSTGRES_HOST to 'db' (the compose service name).
    # On a runner the service is published on localhost, so it must be overridden.
    env:
      POSTGRES_DB: youtube_organizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate

      # Django builds its own test_* database from the credentials above.
      # No coverage gate yet — the backend suite arrives with the layered
      # package skeleton and test runner (story 1-2).
      - name: Run tests
        working-directory: backend
        run: python manage.py test

  build:
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth: an exact pin, read by nvm and enforced by
          # .githooks/pre-push, which blocks a push made on a different Node.
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # next build runs ESLint and type-checking during compilation, so it
      # catches what the Turbopack dev server hides (phantom deps included).
      - name: Production build
        working-directory: frontend
        run: npm run build
