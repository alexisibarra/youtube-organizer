name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - 'Dockerfile*'
      - 'nx.json'
      - 'package.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - 'Dockerfile*'
      - 'nx.json'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check (all projects)
        run: pnpm exec nx run-many -t type-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint affected projects
        run: pnpm exec nx affected --base=origin/main --head=HEAD -t lint

  test:
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: accountr
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: |
          PGPASSWORD=test psql -h localhost -U test -d accountr -c "CREATE DATABASE accountr_test;" || true

      - name: Run database migrations
        run: pnpm exec nx run backend:prisma-migrate
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/accountr

      - name: Run test database migrations
        run: DATABASE_URL=postgres://test:test@localhost:5432/accountr_test pnpm exec prisma migrate deploy --schema apps/backend/prisma/schema.prisma

      - name: Run tests
        run: pnpm exec nx affected --base=origin/main --head=HEAD -t test -- --coverage --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test:test@localhost:5432/accountr
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/accountr_test
          JWT_ACCESS_SECRET: test-secret-min-32-chars-long-here
          JWT_REFRESH_SECRET: test-secret-min-32-chars-long-here
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          EXCHANGE_RATE_API_KEY: test-api-key
          EXCHANGE_RATE_API_BASE_URL: https://api.exchangerate-api.com/v4
          FRONTEND_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3000/api

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

      - name: Publish coverage to step summary
        if: always()
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage/apps/backend/coverage-summary.json" ]; then
            echo "### Backend" >> $GITHUB_STEP_SUMMARY
            cat coverage/apps/backend/coverage-summary.json | jq -r 'to_entries[] | select(.key == "total") | "\n| Metric | Coverage |\n|--------|----------|\n| Lines | " + (.value.lines.pct | tostring) + "% |\n| Statements | " + (.value.statements.pct | tostring) + "% |\n| Functions | " + (.value.functions.pct | tostring) + "% |\n| Branches | " + (.value.branches.pct | tostring) + "% |"' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "coverage/apps/frontend/coverage-summary.json" ]; then
            echo "### Frontend" >> $GITHUB_STEP_SUMMARY
            cat coverage/apps/frontend/coverage-summary.json | jq -r 'to_entries[] | select(.key == "total") | "\n| Metric | Coverage |\n|--------|----------|\n| Lines | " + (.value.lines.pct | tostring) + "% |\n| Statements | " + (.value.statements.pct | tostring) + "% |\n| Functions | " + (.value.functions.pct | tostring) + "% |\n| Branches | " + (.value.branches.pct | tostring) + "% |"' >> $GITHUB_STEP_SUMMARY
          fi

  build:
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build affected projects
        run: pnpm exec nx affected --base=origin/main --head=HEAD -t build

  push-to-ghcr:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
